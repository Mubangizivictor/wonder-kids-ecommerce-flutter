name: ecom
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.4
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2

  # State Management (Bloc)
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Firebase Core & Auth
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0

  # Firebase Databases
  cloud_firestore: ^5.0.1
  firebase_database: ^11.0.1

  # Firebase Storage & Messaging
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.2.2

  # Firebase Analytics & Crashlytics
  firebase_analytics: ^11.0.1
  firebase_crashlytics: ^4.0.1

  # Local Persistence (Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_ce: ^2.2.1
  hive_ce_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2  # Updated to match flutter_localizations requirement

  buttons_tabbar: ^1.3.15
  smooth_page_indicator: ^2.0.1
  lottie: ^3.3.3
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  url_launcher: ^6.2.5
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_svg: ^2.3.0
  share_plus: ^10.1.0
  flutter_image_compress: ^2.4.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  mockito: ^5.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/wonder-kids-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/wonder-kids-icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
    - assets/logos/
