<svg width="400" height="160" viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="160" fill="#FFF9FB"/>

  <!-- Outer glow -->
  <circle cx="80" cy="80" r="62" fill="#FCE4EC" opacity="0.7"/>

  <!-- Pink petals -->
  <ellipse cx="80" cy="28" rx="18" ry="26" fill="#FF6B9D"/>
  <ellipse cx="80" cy="132" rx="18" ry="26" fill="#FF6B9D"/>
  <ellipse cx="28" cy="80" rx="26" ry="18" fill="#FF6B9D"/>
  <ellipse cx="132" cy="80" rx="26" ry="18" fill="#FF6B9D"/>

  <!-- Blue diagonal petals -->
  <ellipse cx="43" cy="43" rx="14" ry="20" fill="#4FC3F7" transform="rotate(-45 43 43)"/>
  <ellipse cx="117" cy="43" rx="14" ry="20" fill="#4FC3F7" transform="rotate(45 117 43)"/>
  <ellipse cx="43" cy="117" rx="14" ry="20" fill="#4FC3F7" transform="rotate(45 43 117)"/>
  <ellipse cx="117" cy="117" rx="14" ry="20" fill="#4FC3F7" transform="rotate(-45 117 117)"/>

  <!-- Center -->
  <circle cx="80" cy="80" r="30" fill="#FF6B9D"/>
  <circle cx="80" cy="80" r="22" fill="white"/>
  <text x="80" y="87" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FF6B9D">W</text>

  <!-- Sparkles -->
  <text x="152" y="28" font-size="18" fill="#4FC3F7" text-anchor="middle" font-family="serif">✦</text>
  <text x="165" y="48" font-size="11" fill="#FF6B9D" text-anchor="middle" font-family="serif">✦</text>

  <!-- Wordmark -->
  <text x="178" y="68" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#FF6B9D">Wonder</text>
  <text x="178" y="114" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#4FC3F7">Kids</text>

  <!-- Tagline -->
  <text x="178" y="138" font-family="Arial, sans-serif" font-size="12" fill="#B06080" letter-spacing="2">PLAY · GROW · EXPLORE</text>
</svg>
